steps:
  # 1. Build the container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/mindpilot-ai:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/mindpilot-ai:latest', '.']

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mindpilot-ai:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mindpilot-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mindpilot-ai:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/mindpilot-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mindpilot-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
