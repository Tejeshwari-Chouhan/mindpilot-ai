apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mindpilot-ai
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/mindpilot-ai:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1000m'
              memory: '1024Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: GCP_PROJECT_ID
              value: 'PROJECT_ID'
            - name: GCP_REGION
              value: 'asia-south1'
            - name: VERTEX_AI_LOCATION
              value: 'us-central1'
            - name: GCS_BUCKET_NAME
              value: 'mindpilot-media-vault'
            - name: BIGQUERY_DATASET
              value: 'mindpilot_analytics'
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
